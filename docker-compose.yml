name: spring-boot-microservices-assessment

# Memory and CPU settings shared by the three Spring Boot services. Serial GC, a 160 MB heap and
# C1-only compilation cut idle memory by about a quarter and startup CPU by about two thirds
# compared with the JVM defaults, without changing any response.
x-jvm-options: &jvm-options "${JVM_OPTIONS:--XX:+UseSerialGC -Xmx160m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:TieredStopAtLevel=1}"

services:
  gateway-discovery:
    build:
      context: .
      dockerfile: services/gateway-discovery/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: *jvm-options
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    # Healthy only once api-1 and api-2 are registered and routable, so the APIs wait for it to
    # start rather than to be healthy. The longer budget covers both APIs starting after it.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessment}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-1:
    build:
      context: .
      dockerfile: services/api-1-user-aggregator/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: *jvm-options
      REDIS_HOST: redis
      EUREKA_URL: http://gateway-discovery:8080/eureka/
    depends_on:
      gateway-discovery:
        condition: service_started
      redis:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api-2:
    build:
      context: .
      dockerfile: services/api-2-post-xml/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: *jvm-options
      POSTGRES_HOST: postgres
      EUREKA_URL: http://gateway-discovery:8080/eureka/
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessment}
    depends_on:
      gateway-discovery:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
