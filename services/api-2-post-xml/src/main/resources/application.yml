server:
  port: 8082

spring:
  application:
    name: api-2-post-xml
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:assessment}
    username: ${POSTGRES_USER:assessment}
    password: ${POSTGRES_PASSWORD:assessment}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by the init scripts in infra/postgres/init.
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    prefer-ip-address: true
    # Also how soon a failed first registration is retried when Eureka starts after this service.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
