server:
  port: 8081

spring:
  application:
    name: api-1-user-aggregator
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    # Defaults keep an empty instance list for 35s, which would outlive api-2 registering late.
    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Also how soon a failed first registration is retried when Eureka starts after this service.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

clients:
  posts:
    base-url: http://api-2-post-xml
    connect-timeout: 2s
    read-timeout: 5s
  todos:
    base-url: ${TODOS_BASE_URL:https://jsonplaceholder.typicode.com}
    # Connecting to the public service was measured above 2s, mostly on the first TLS handshake.
    connect-timeout: 3s
    read-timeout: 5s
