server:
  port: 8081

spring:
  application:
    name: api-1-user-aggregator
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

clients:
  posts:
    base-url: ${POSTS_BASE_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s
  todos:
    base-url: ${TODOS_BASE_URL:https://jsonplaceholder.typicode.com}
    # Connecting to the public service was measured above 2s, mostly on the first TLS handshake.
    connect-timeout: 3s
    read-timeout: 5s
